[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "golconda"
version = "0.1.0"
description = "Generator of Lensing Convergence with Optimized Non-Gaussian Distribution Adjustment"
authors = [{ name = "Vilasini Tinnaneri Sreekanth" }]
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Physics",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "numpy>=1.24",
    "scipy>=1.11",
    "astropy>=5.0",
    "healpy",
    "jax>=0.4",
    "pyfftw",
    "lenspack",
    "scikit-image",
    "tqdm",
]

[project.optional-dependencies]
notebooks = [
    "matplotlib",
    "jupyter",
    "notebook",
    "ipykernel",
    "pyccl",
]
docs = [
    "sphinx>=7",
    "sphinx-rtd-theme",
    "sphinx-autodoc-typehints",
    "numpydoc",
    "myst-parser",
]
dev = [
    "golconda[notebooks,docs]",
]

[project.urls]
"Source Code" = "https://github.com/vilasinits/GOLCONDA"

[tool.setuptools.packages.find]
where = ["src"]
